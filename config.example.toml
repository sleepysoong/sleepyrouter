version = 1

[server]
host = "127.0.0.1"
port = 4567

[routing]
default_group = "coding"

[timeouts]
request = "180s"
first_event = "45s"
stream_idle = "330s"

[logging]
level = "info"
format = "text"

[usage]
enabled = true

[providers.zen]
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"

# Optional separate NVIDIA hosted provider for endpoints documented as
# Chat Completions only. The existing `nvidia` provider above stays on Responses.
# [providers.nvidia-nim]
# base_url = "https://integrate.api.nvidia.com/v1"
# api_key_env = "NVIDIA_NIM_API_KEY"
# wire_api = "chat_completions"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models."zen/model-a"]
provider = "zen"
upstream_model = "model-a"

[models."nvidia/model-b"]
provider = "nvidia"
upstream_model = "vendor/model-b"

[models."gemini/model-c"]
provider = "gemini"
upstream_model = "model-c"

# A model ID containing "/" must be quoted as one TOML key.
[models."openrouter/model-d"]
provider = "openrouter"
upstream_model = "vendor/model-d"

# Optional capabilities (absent = unknown = allowed):
# [models."openrouter/model-d".capabilities]
# tools = true
# vision = true
# reasoning = true

# Optional per-model upstream defaults (applied only when the client
# omits them; explicit client values always win). `thinking_budget` is
# Anthropic-specific and invalid because all upstream requests use Responses:
# reasoning_effort = "high"
# [models."openrouter/model-d".extra]
# service_tier = "flex"

[groups]
coding = [
  "zen/model-a",
  "nvidia/model-b",
  "gemini/model-c",
  "openrouter/model-d",
]
fast = [
  "gemini/model-c",
  "nvidia/model-b",
]
