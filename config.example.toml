version = 1

[server]
host = "127.0.0.1"
port = 4567
request_body_limit_mb = 32
shutdown_grace = "10s"

[routing]
default_group = "coding"
unknown_model_policy = "default_group"

[timeouts]
request = "180s"
first_event = "45s"
stream_idle = "330s"

[logging]
level = "info"
format = "text"

[usage]
enabled = true

[providers.zen]
enabled = true
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"

[providers.nvidia]
enabled = true
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"

[providers.gemini]
enabled = true
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[providers.openrouter]
enabled = true
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models."zen/model-a"]
provider = "zen"
upstream_model = "model-a"

[models."nvidia/model-b"]
provider = "nvidia"
upstream_model = "vendor/model-b"

[models."gemini/model-c"]
provider = "gemini"
upstream_model = "model-c"

[models."openrouter/model-d"]
provider = "openrouter"
upstream_model = "vendor/model-d"

# Optional capabilities (absent = unknown = allowed):
# [models."openrouter/model-d".capabilities]
# tools = true
# vision = true
# reasoning = true

# Optional per-model upstream defaults (applied only when the client
# omits them; explicit client values always win). `thinking_budget` is
# Anthropic-specific and invalid because all upstream requests use Responses:
# reasoning_effort = "high"
# [models."openrouter/model-d".extra]
# service_tier = "flex"

[groups]
coding = [
  "zen/model-a",
  "nvidia/model-b",
  "gemini/model-c",
  "openrouter/model-d",
]
fast = [
  "gemini/model-c",
  "nvidia/model-b",
]

[aliases]
"sleepy-claude-coding" = "coding"
"sleepy-claude-fast" = "fast"
"gpt-sleepy" = "coding"
